# KOGNIT API + Caddy (HTTPS automático com Let's Encrypt) — para uma máquina EC2 (ver docs/DEPLOY-AWS.md).
# O banco de dados é o Supabase (PostgreSQL), configurado no arquivo .env.
services:
  api:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      ASPNETCORE_URLS: http://+:8080
      BancoDeDados__Provedor: Postgres
      # Atrás do Caddy: usa o IP real do usuário (repassado em X-Forwarded-For) no limite de tentativas de login.
      # Seguro porque a porta 8080 não é publicada: só o Caddy, na rede interna do Docker, chega na API.
      ASPNETCORE_FORWARDEDHEADERS_ENABLED: "true"
    expose:
      - "8080"

  caddy:
    image: caddy:2.10.0
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMINIO: ${DOMINIO:?defina DOMINIO no arquivo .env}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  caddy_data:
  caddy_config:
